    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop stop-color="#ff5a00"/>
      <stop offset="1" stop-color="#ffe14a"/>
    </linearGradient>
  </defs>
  <rect width="320" height="420" fill="url(#bg)"/>
